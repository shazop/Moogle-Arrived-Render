services:
  - type: web
    name: moogle-drive-ctf
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLAG
        value: "$N1PH€RSxTCTF{w04h!_y0u_3xpl0t3d_7H3_33RF_X33_JW7_C0nfus10n_csadsa3}"
